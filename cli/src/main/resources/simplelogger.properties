# Configures the slf4j-simple binding (see cli/pom.xml). Quiet by default - only warnings/errors
# from the underlying Git/SSH libraries show up unless overridden. To see everything (useful when
# troubleshooting a real push/pull/clone against a remote), run with:
#   -Dorg.slf4j.simpleLogger.defaultLogLevel=debug
# or override just the noisy packages, e.g.:
#   -Dorg.slf4j.simpleLogger.log.org.apache.sshd=debug -Dorg.slf4j.simpleLogger.log.org.eclipse.jgit=debug

org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

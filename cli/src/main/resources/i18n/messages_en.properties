usage.text=Usage: rikiki-vault [-C <vault-dir>] <command> [args]\n\nCommands:\n  init [--git] [--remote <url>] <machine-label>\n  whoami\n  export-key <output-file>\n  clone <remote-uri>       (join an already-existing vault - the first machine uses 'init')\n  restore [--force]        (rebuild local/ from documents/ - use after deleting local/ by accident)\n  clear-local [--include-unpublished]   (delete local/ - keeps only what's published in documents/; use 'restore' to bring it back)\n  status\n  publish -m "<message>"\n  pull\n  authorize <label> <public-key-file>\n  revoke <fingerprint-hex>\n  git-auth show|set-ssh-key <path>|clear-ssh-key|set-token|clear-token\n            |set-http-basic <username>|clear-http-basic|use ssh|token|http|none\n

usage.text=Uso\: rikiki-vault [-C <vault-dir>] <comando> [args]\n\nComandos\:\n  init [--git] [--remote <url>] <machine-label>\n  whoami\n  export-key <output-file>\n  clone <remote-uri>       (entrar num vault já existente - a primeira máquina usa 'init')\n  restore [--force]        (reconstrói local/ a partir de documents/ - usa depois de apagares local/ sem querer)\n  clear-local [--include-unpublished]   (apaga local/ - mantém publicado só em documents/; usa 'restore' para o trazer de volta)\n  status\n  publish -m "<message>"\n  pull\n  authorize <label> <public-key-file>\n  revoke <fingerprint-hex>\n  git-auth show|set-ssh-key <path>|clear-ssh-key|set-token|clear-token\n            |set-http-basic <username>|clear-http-basic|use ssh|token|http|none\n  set-passphrase           (protege/muda a passphrase da identidade desta máquina)\n  remove-passphrase        (remove a proteção por passphrase)\n

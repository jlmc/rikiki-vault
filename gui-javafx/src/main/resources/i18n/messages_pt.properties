errorAdvice.generic.explanation=Ocorreu um erro inesperado nesta operação.
errorAdvice.generic.suggestion=Tenta novamente; se persistir, confirma a ligação e as credenciais em Configurações → Git.
errorAdvice.gitAuth.explanation=Não foi possível autenticar no repositório remoto.
errorAdvice.gitAuth.suggestion=Verifica o método ativo em Configurações → Git (chave SSH carregada no agente, token válido, ou utilizador/password corretos).
errorAdvice.network.explanation=Não foi possível contactar o servidor remoto.
errorAdvice.network.suggestion=Verifica a tua ligação à internet e o URL do remoto.
errorAdvice.unauthorizedMachine.explanation=Esta máquina ainda não está autorizada a abrir este ficheiro.
errorAdvice.unauthorizedMachine.suggestion=Pede a uma máquina já autorizada para te autorizar em "Gerir acesso".
errorAdvice.machineIdentityExists.explanation=Esta máquina já tem uma identidade - é global à máquina, não a um vault específico.
errorAdvice.machineIdentityExists.suggestion=Se estás a tentar abrir um segundo vault nesta máquina, isso já é esperado - a identidade é reutilizada automaticamente.
errorAdvice.uninitializedVault.explanation=O repositório remoto ainda não foi inicializado como vault por nenhuma máquina.
errorAdvice.uninitializedVault.suggestion=Usa "Criar um novo vault aqui" em vez de "Entrar", ou confirma que o remoto está mesmo correto.
errorAdvice.vaultAlreadyInitialized.explanation=Este vault já tem destinatários - já foi inicializado antes.
errorAdvice.vaultAlreadyInitialized.suggestion=Usa "Entrar num vault já existente" em vez de "Criar".
errorAdvice.corruptedData.explanation=Um ficheiro de metadados do vault (manifesto ou registo de destinatários) parece estar corrompido.
errorAdvice.corruptedData.suggestion=Confirma o histórico git do vault; pode ser preciso restaurar a partir de um commit anterior.


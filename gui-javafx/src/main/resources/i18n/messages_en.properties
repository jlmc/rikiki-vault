errorAdvice.generic.explanation=An unexpected error occurred during this operation.
errorAdvice.generic.suggestion=Try again; if it persists, check your connection and credentials in Settings → Git.
errorAdvice.gitAuth.explanation=Couldn't authenticate with the remote repository.
errorAdvice.gitAuth.suggestion=Check the active method in Settings → Git (SSH key loaded in the agent, a valid token, or correct username/password).
errorAdvice.network.explanation=Couldn't reach the remote server.
errorAdvice.network.suggestion=Check your internet connection and the remote URL.
errorAdvice.unauthorizedMachine.explanation=This machine isn't authorized to open this file yet.
errorAdvice.unauthorizedMachine.suggestion=Ask an already-authorized machine to authorize you in "Manage access".
errorAdvice.machineIdentityExists.explanation=This machine already has an identity - it's global to the machine, not tied to a specific vault.
errorAdvice.machineIdentityExists.suggestion=If you're trying to open a second vault on this machine, that's expected - the identity is reused automatically.
errorAdvice.uninitializedVault.explanation=The remote repository hasn't been initialized as a vault by any machine yet.
errorAdvice.uninitializedVault.suggestion=Use "Create a new vault here" instead of "Join", or confirm the remote is actually correct.
errorAdvice.vaultAlreadyInitialized.explanation=This vault already has recipients - it was already initialized before.
errorAdvice.vaultAlreadyInitialized.suggestion=Use "Join an existing vault" instead of "Create".
errorAdvice.corruptedData.explanation=A vault metadata file (manifest or recipient registry) appears to be corrupted.
errorAdvice.corruptedData.suggestion=Check the vault's git history; you may need to restore from an earlier commit.

